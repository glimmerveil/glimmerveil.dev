<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://tracker.openwebtorrent.com wss://tracker.webtorrent.dev; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>The Office</title>
<style>
  :root { --bg: #0d0f14; --ink: #d8dde8; --dim: #7c8597; --mine: #8fd3ff; --line: #1c2130; --glow: #39d3c3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .08em; color: var(--glow); text-transform: uppercase; }
  #status { color: var(--dim); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 10px 16px; overscroll-behavior: contain; }
  #log p { margin: 0 0 8px; word-wrap: break-word; }
  #log b { color: var(--glow); font-weight: 600; }
  #log p.mine b { color: var(--mine); }
  #log p.quiet { color: var(--dim); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  #say { flex: 1; min-height: 44px; max-height: 30vh; resize: none; background: #141824; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
  button { min-width: 64px; min-height: 44px; border: 0; border-radius: 8px; background: var(--glow); color: #04110f; font: inherit; font-weight: 700; }
  details { padding: 0 16px 8px; color: var(--dim); font-size: 12px; }
  #key { word-break: break-all; color: var(--ink); }
  #copy, #forget { min-height: 32px; min-width: 0; padding: 0 10px; font-size: 12px; margin-top: 4px; }
  #seats { display: flex; gap: 6px; padding: 8px 16px 0; overflow-x: auto; }
  #seats button { min-width: 0; min-height: 36px; padding: 0 12px; background: #141824; color: var(--glow); border: 1px solid var(--line); font-weight: 600; }
</style>
</head>
<body>
<header><h1>The Office</h1><span id="status">coming in…</span></header>
<div id="log" aria-live="polite"></div>
<details><summary>this phone's key</summary><div id="key">…</div><button id="copy" type="button">copy</button> <button id="forget" type="button">forget this room</button>
  <div>Paired once at the PC, its words reach the seats. Never shared: the private half cannot leave this browser.</div></details>
<div id="seats"><button type="button" data-seat="Office">Office</button><button type="button" data-seat="Game">Game</button><button type="button" data-seat="Art">Art</button><button type="button" data-seat="Matt">Matt</button><button type="button" data-seat="Opus">Opus</button><button type="button" data-seat="Everyone">Everyone</button></div>
<form id="form"><textarea id="say" rows="1" placeholder="Office, … · game and art: … · everyone, …" enterkeyhint="send"></textarea><button>Say</button></form>
<script type="module" src="./face/terminal.mjs?v=3"></script>
</body>
</html>
